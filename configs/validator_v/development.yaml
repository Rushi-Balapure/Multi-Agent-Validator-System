# Stack V batch runner. method_id is V. The scored label is the reconciled
# D0∪D1 four-way judgment mapped onto SUPPORT / REFUTE / NEI
# (supported→SUPPORT, contradicted→REFUTE, unaddressed and underdetermined→NEI).
# Default is an offline fixture-report dry-run. --gather is opt-in: D1 via
# Retrieval Wing gather(neutral_question, config, claim_id); D0 from SciFact
# cited_doc_ids abstracts (provenance=original). Gold evidence is not loaded.
# claim_ids is the Phase-3 B2 development prefix (same order as
# same-evidence-b2-development-s0-n20-dac855c4e2ae). Used only with --gather;
# --dry-run still judges the report fixtures below.
# Development budget is the locked split size (709). Held-out needs --frozen-final.
# Live n=300 runs pass --limit 300 --claim-ids-file; do not edit this
# default after freeze.json is written.
system_id: validator_v
method_id: V
adaptation: V
adaptation_note: >
  Independent retrieval plus staged D0 union D1 judgment.
  Eval reads the reconciled four-way label mapped onto SUPPORT, REFUTE, or NEI.
split: development
limit: 20
seed: 0
# --live applies OPENAI_MODEL and https://api.openai.com/v1 when both
# OPENAI_API_KEY and OPENAI_MODEL are set in the environment or .env.
model_id: qwen2.5-coder-1.5b-instruct
base_url: http://127.0.0.1:1234/v1
temperature: 0
timeout_seconds: 120
dry_run: true
prediction_label_space: scifact_SUPPORT_REFUTE_NEI
four_way_label_space: mavs_four_way
scored_evidence_scope: D0_union_D1
retrieval_config: configs/retrieval/scifact_bm25.yaml
neutral_question: prompts/validator_v/neutral_question_v1.txt
claim_ids:
  - "scifact:0"
  - "scifact:2"
  - "scifact:4"
  - "scifact:6"
  - "scifact:9"
  - "scifact:10"
  - "scifact:11"
  - "scifact:12"
  - "scifact:14"
  - "scifact:15"
  - "scifact:17"
  - "scifact:18"
  - "scifact:19"
  - "scifact:20"
  - "scifact:21"
  - "scifact:22"
  - "scifact:24"
  - "scifact:25"
  - "scifact:26"
  - "scifact:27"
reports:
  - tests/fixtures/judgment/e2e_happy.json
  - tests/fixtures/judgment/e2e_conflict.json
  - tests/fixtures/judgment/e2e_missing_citation.json
output:
  predictions: artifacts/validator_v/predictions.jsonl
  run_sidecar: artifacts/validator_v/run.json
