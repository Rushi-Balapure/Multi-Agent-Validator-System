[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-validator-system"
version = "0.1.0"
description = "Inference-time scientific validator. Same-evidence B2 baseline plus the SciFact BM25 retrieval CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mavs-retrieve = "validator.retrieve:main"
same-evidence-baseline = "validator.same_evidence.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
